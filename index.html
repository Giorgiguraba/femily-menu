<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F5F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F0F10" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="მენიუ ♥">
<title>შენი კვირის მენიუ</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@300;400;500;600&family=Noto+Serif+Georgian:wdth,wght@62.5..100,300..900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F6F5F3;
    --card: #FFFFFF;
    --ink: #18181B;
    --muted: #71717A;
    --line: #E7E5E4;
    --accent: #E5484D;
    --good: #1F9D6B;
    --chip: rgba(255, 255, 255, .92);
    --shadow: 0 18px 40px -22px rgba(24, 24, 27, .35);
    --display: "Noto Serif Georgian", Georgia, serif;
    --body: "Noto Sans Georgian", system-ui, sans-serif;
    --radius: 22px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0F0F10;
      --card: #1A1A1C;
      --ink: #F4F4F5;
      --muted: #A1A1AA;
      --line: #2A2A2D;
      --accent: #FF6369;
      --good: #3DDC97;
      --chip: rgba(26, 26, 28, .88);
      --shadow: 0 18px 40px -22px rgba(0, 0, 0, .9);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; scroll-padding-top: 16px; }
  html, body { overflow-x: clip; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--body); line-height: 1.5; min-height: 100vh;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  }
  button, input, textarea, select { font: inherit; color: inherit; }
  img { display: block; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px 72px; }

  /* ---------- header ---------- */
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 26px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: .95rem; }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; flex: none;
    background: conic-gradient(from 200deg, #F58529, #DD2A7B, #8134AF, #F58529); padding: 2px;
  }
  .avatar span { width: 100%; height: 100%; border-radius: 50%; background: var(--card); display: grid; place-items: center; color: var(--accent); }
  .topnav { display: flex; gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
  .topnav a { text-decoration: none; font-size: .85rem; padding: 6px 14px; border-radius: 999px; }
  .topnav a.on { background: var(--ink); color: var(--card); }

  .eyebrow { font-size: .75rem; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
  .muted { color: var(--muted); }

  /* ---------- today: swipe deck ---------- */
  .match {
    display: grid; grid-template-columns: 1fr minmax(0, 420px); column-gap: 56px; row-gap: 26px;
    grid-template-areas: "text deck" "budget deck"; align-items: center; padding: 8px 0;
  }
  .match-text { grid-area: text; align-self: end; }
  .budget { grid-area: budget; align-self: start; }
  .deck-wrap { grid-area: deck; }
  .match-text .eyebrow { display: inline-block; margin-bottom: 14px; }
  .match-text h1 {
    font-family: var(--display); font-weight: 800; font-stretch: 70%;
    font-size: clamp(2.4rem, 6.5vw, 4.6rem); line-height: 1; margin-bottom: 14px;
  }
  .match-text p { color: var(--muted); max-width: 40ch; }
  .match-text .note { font-family: var(--display); font-style: italic; font-weight: 300; font-size: 1.15rem; color: var(--ink); margin-top: 16px; padding-left: 14px; border-left: 3px solid var(--accent); }

  .budget { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px; max-width: 460px; }
  .budget h3 { font-size: .95rem; font-weight: 600; margin-bottom: 12px; }
  .budget-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .chip {
    border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 7px 14px;
    font-size: .85rem; cursor: pointer; white-space: nowrap; transition: background .2s, color .2s;
  }
  .chip.on { background: var(--ink); color: var(--card); border-color: var(--ink); }
  .custom { display: flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 3px 12px; }
  .custom.on { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .custom input { width: 54px; border: 0; background: transparent; padding: 4px 0; font-size: .85rem; outline: none; }
  .budget .muted { font-size: .8rem; margin-top: 10px; }

  .deck { position: relative; aspect-ratio: 3 / 4; width: 100%; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
  .swipe {
    position: absolute; inset: 0; border-radius: 28px; overflow: hidden; background: #222;
    box-shadow: var(--shadow); cursor: grab; will-change: transform;
  }
  .swipe:active { cursor: grabbing; }
  .swipe img, .swipe .placeholder { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
  .swipe::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,.82) 100%); pointer-events: none; }
  .swipe.behind { transform: scale(.94) translateY(18px); filter: brightness(.85); transition: transform .35s, filter .35s; cursor: default; }
  .swipe-info { position: absolute; left: 0; right: 0; bottom: 0; padding: 24px; color: #fff; z-index: 1; pointer-events: none; }
  .swipe-info h2 { font-family: var(--display); font-weight: 800; font-stretch: 72%; font-size: clamp(1.9rem, 5vw, 2.6rem); line-height: 1.02; margin: 10px 0 12px; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill { display: inline-block; background: rgba(255,255,255,.18); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); padding: 5px 12px; border-radius: 999px; font-size: .78rem; font-weight: 600; }
  .pill.mine { background: var(--accent); }
  .info-btn {
    pointer-events: auto; border: 0; cursor: pointer; background: #fff; color: #18181B;
    border-radius: 999px; padding: 6px 14px; font-size: .8rem; font-weight: 600;
  }
  .stamp {
    position: absolute; top: 30px; z-index: 2; padding: 4px 14px; border: 4px solid; border-radius: 12px;
    font-family: var(--display); font-weight: 900; font-stretch: 70%; font-size: 2rem; opacity: 0; pointer-events: none;
  }
  .stamp.yes { left: 24px; color: #3DDC97; transform: rotate(-14deg); }
  .stamp.no { right: 24px; color: #FF5A5F; transform: rotate(14deg); }
  .empty-deck {
    position: absolute; inset: 0; border-radius: 28px; border: 2px dashed var(--line); display: grid; place-items: center;
    text-align: center; padding: 32px; color: var(--muted);
  }
  .empty-deck b { display: block; font-family: var(--display); font-size: 1.5rem; color: var(--ink); margin-bottom: 6px; }

  .choices { display: flex; justify-content: center; gap: 26px; margin-top: 22px; }
  .round {
    width: 66px; height: 66px; border-radius: 50%; border: 1px solid var(--line); background: var(--card);
    box-shadow: var(--shadow); font-size: 1.6rem; cursor: pointer; display: grid; place-items: center;
    transition: transform .2s;
  }
  .round:hover { transform: scale(1.1); }
  .round.no { color: #FF5A5F; }
  .round.yes { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chosen .swipe { cursor: default; }
  .chosen .stamp.yes { opacity: 1; }
  .heart-pop { animation: heartPop .6s cubic-bezier(.2,.8,.2,1); }
  @keyframes heartPop { 0% { transform: scale(.85); } 60% { transform: scale(1.04); } 100% { transform: none; } }

  /* ---------- sections & grids ---------- */
  .section-head { display: flex; align-items: baseline; justify-content: space-between; margin: 64px 0 16px; gap: 12px; flex-wrap: wrap; }
  .section-head h2 { font-family: var(--display); font-weight: 700; font-stretch: 75%; font-size: 1.9rem; }
  .section-head span { font-size: .85rem; color: var(--muted); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 20px; }
  .card {
    background: var(--card); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line);
    cursor: pointer; text-align: left; display: flex; flex-direction: column; padding: 0;
    transition: transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s;
  }
  .card:hover { transform: translateY(-5px); box-shadow: var(--shadow); }
  .card.is-today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .photo { position: relative; aspect-ratio: 4 / 5; overflow: hidden; background: var(--line); width: 100%; }
  .grid.dishes .photo { aspect-ratio: 1; }
  .photo img { width: 100%; height: 100%; object-fit: cover; transition: transform .8s cubic-bezier(.2,.8,.2,1); }
  .card:hover .photo img { transform: scale(1.06); }
  .day-chip, .price-chip {
    position: absolute; top: 12px; background: var(--chip); color: var(--ink);
    font-size: .76rem; font-weight: 600; padding: 4px 11px; border-radius: 999px;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .day-chip { left: 12px; }
  .day-chip.now { background: var(--accent); color: #fff; }
  .price-chip { right: 12px; }
  .price-chip.over { background: var(--accent); color: #fff; }
  .card-body { padding: 14px 16px 16px; display: grid; gap: 4px; }
  .card-body h3 { font-family: var(--display); font-weight: 700; font-stretch: 80%; font-size: 1.22rem; line-height: 1.15; }
  .card-body p { font-size: .8rem; color: var(--muted); }

  .placeholder {
    width: 100%; height: 100%; display: grid; place-items: center; font-size: 3rem;
    background: radial-gradient(circle at 30% 20%, #FFD9C2, transparent 60%), radial-gradient(circle at 80% 90%, #F9C6D3, transparent 55%), #FBE9E1;
  }

  .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
  .search {
    flex: 1 1 220px; border: 1px solid var(--line); background: var(--card); border-radius: 999px;
    padding: 9px 16px; font-size: .9rem; outline: none;
  }
  .search:focus { border-color: var(--ink); }
  .cats { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .cats::-webkit-scrollbar { display: none; }
  select.sort { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 8px 14px; font-size: .85rem; }
  .none { color: var(--muted); padding: 30px 0; text-align: center; grid-column: 1 / -1; }

  /* ---------- dialog ---------- */
  dialog {
    border: 0; padding: 0; border-radius: 26px; background: var(--card); color: var(--ink);
    width: min(900px, calc(100% - 32px)); max-height: calc(100% - 32px); margin: auto; overflow: auto;
    box-shadow: 0 40px 80px -30px rgba(0,0,0,.5);
  }
  dialog::backdrop { background: rgba(10,10,12,.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  dialog[open] { animation: pop .35s cubic-bezier(.2,.8,.2,1); }
  @keyframes pop { from { transform: translateY(16px) scale(.98); opacity: 0; } }
  .sheet { display: grid; grid-template-columns: 1fr 1.1fr; }
  .sheet > .photo { aspect-ratio: auto; min-height: 440px; }
  .sheet.recipe > .photo { position: sticky; top: 0; height: min(100%, 640px); max-height: calc(100vh - 32px); }
  .sheet-body { padding: 28px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  .sheet-top { display: flex; justify-content: space-between; align-items: center; }
  .close { border: 0; background: var(--bg); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 1.1rem; flex: none; }
  .sheet h2 { font-family: var(--display); font-weight: 800; font-stretch: 72%; font-size: 2.3rem; line-height: 1.05; }
  .sheet h4 { font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; }
  .meta span { background: var(--bg); border-radius: 999px; padding: 5px 12px; font-size: .82rem; }
  .meta .cost { background: var(--good); color: #fff; font-weight: 600; }
  .meta .cost.over { background: var(--accent); }
  .meals { display: grid; gap: 10px; }
  .meals div { display: grid; grid-template-columns: 80px 1fr; gap: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
  .meals small { font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding-top: 3px; }
  .sheet .note { font-family: var(--display); font-style: italic; font-weight: 300; font-size: 1.1rem; color: var(--muted); }

  table.ings { width: 100%; border-collapse: collapse; font-size: .9rem; }
  .ings td { padding: 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  .ings td:nth-child(2) { color: var(--muted); padding: 8px 10px; white-space: nowrap; }
  .ings td:last-child { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .ings tfoot td { font-weight: 600; border-bottom: 0; padding-top: 12px; }
  ol.steps { padding-left: 0; list-style: none; counter-reset: s; display: grid; gap: 12px; }
  ol.steps li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; gap: 10px; font-size: .93rem; }
  ol.steps li::before {
    content: counter(s); width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: var(--card);
    display: grid; place-items: center; font-size: .78rem; font-weight: 600;
  }
  .fine { font-size: .75rem; color: var(--muted); }

  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .sheet-body > .actions:last-child { margin-top: auto; }
  .btn {
    border: 0; border-radius: 999px; padding: 10px 18px; cursor: pointer; font-weight: 600; font-size: .88rem;
    background: var(--ink); color: var(--card); text-decoration: none; display: inline-flex; align-items: center; gap: 8px;
  }
  .btn.soft { background: var(--bg); color: var(--ink); font-weight: 500; }
  .btn.accent { background: var(--accent); color: #fff; }
  .btn.video { background: #FF0033; color: #fff; }

  form.edit { display: grid; gap: 12px; }
  form.edit label { display: grid; gap: 4px; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  form.edit input[type=text], form.edit textarea {
    text-transform: none; letter-spacing: 0; font-size: .95rem; font-weight: 400; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; resize: vertical; width: 100%;
  }
  .upload { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 8px; z-index: 1; }
  .upload label, .upload button { background: var(--chip); color: var(--ink); border: 0; border-radius: 999px; padding: 8px 14px; font-size: .82rem; font-weight: 600; cursor: pointer; white-space: nowrap; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .upload input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .error { color: var(--accent); font-size: .85rem; }

  footer { margin-top: 56px; text-align: center; color: var(--muted); font-family: var(--display); font-style: italic; }

  /* ---------- phone tab bar ---------- */
  .tabbar { display: none; }

  @media (max-width: 760px) {
    .wrap { padding: 16px 16px calc(96px + env(safe-area-inset-bottom)); }
    header { margin-bottom: 18px; }
    .topnav { display: none; }
    .match > * { min-width: 0; }
    .match { grid-template-columns: minmax(0, 1fr); grid-template-areas: "text" "budget" "deck"; row-gap: 18px; text-align: center; padding: 0; }
    .match-text h1 { margin-bottom: 8px; }
    .match-text p { margin: 0 auto; font-size: .92rem; }
    .match-text .note { border-left: 0; padding-left: 0; font-size: 1.05rem; margin-top: 10px; }
    .budget { max-width: none; padding: 14px; text-align: left; }
    .budget-row { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -14px; padding: 0 14px; }
    .budget-row::-webkit-scrollbar { display: none; }
    .deck { max-width: 380px; margin: 0 auto; aspect-ratio: 4 / 5; }
    .section-head { margin-top: 48px; }
    .section-head h2 { font-size: 1.6rem; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .card-body { padding: 10px 12px 12px; }
    .card-body h3 { font-size: 1.02rem; }
    .grid.week .card-body p { display: none; }
    .day-chip, .price-chip { top: 8px; font-size: .7rem; padding: 3px 9px; }
    .day-chip { left: 8px; } .price-chip { right: 8px; }
    .filters { gap: 8px; }
    .cats { width: 100%; margin: 0 -16px; padding: 0 16px; }

    dialog { width: 100%; max-width: none; max-height: 92vh; margin: auto 0 0; border-radius: 26px 26px 0 0; }
    dialog[open] { animation: slideUp .35s cubic-bezier(.2,.8,.2,1); }
    .sheet { grid-template-columns: 1fr; }
    .sheet > .photo, .sheet.recipe > .photo { position: relative; min-height: 0; height: auto; aspect-ratio: 16 / 10; }
    .sheet-body { padding: 20px 20px calc(24px + env(safe-area-inset-bottom)); }
    .sheet h2 { font-size: 1.9rem; }

    .tabbar {
      display: flex; position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 10;
      background: var(--chip); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--line); border-radius: 22px; padding: 6px; box-shadow: var(--shadow);
    }
    .tabbar a { flex: 1; display: grid; justify-items: center; gap: 1px; text-decoration: none; font-size: .7rem; padding: 6px 0; border-radius: 16px; color: var(--muted); }
    .tabbar a span { font-size: 1.25rem; line-height: 1.2; }
    .tabbar a.on { background: var(--ink); color: var(--card); }
  }
  @keyframes slideUp { from { transform: translateY(40%); opacity: .4; } }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><div class="avatar"><span>♥</span></div>ჩემი სამზარეულო შენთვის</div>
    <nav class="topnav" aria-label="განყოფილებები">
      <a href="#today" data-sec="today">დღეს</a>
      <a href="#week" data-sec="week">კვირა</a>
      <a href="#dishes" data-sec="dishes">კერძები</a>
    </nav>
  </header>

  <section class="match" id="today" aria-live="polite">
    <div class="match-text" id="matchText"></div>
    <div class="budget" id="budget"></div>
    <div class="deck-wrap" id="deckWrap"></div>
  </section>

  <section id="week">
    <div class="section-head">
      <h2>მთელი კვირა</h2>
      <span id="weekMeta"></span>
    </div>
    <div class="grid week" id="grid"></div>
  </section>

  <section id="dishes">
    <div class="section-head">
      <h2>კერძები</h2>
      <span id="dishCount"></span>
    </div>
    <div class="filters">
      <input class="search" id="search" type="search" placeholder="მოძებნე კერძი ან ინგრედიენტი…" aria-label="კერძის ძებნა">
      <select class="sort" id="sort" aria-label="დალაგება">
        <option value="cheap">ჯერ იაფი</option>
        <option value="pricey">ჯერ ძვირი</option>
        <option value="fast">ჯერ სწრაფი</option>
      </select>
      <div class="cats" id="cats"></div>
    </div>
    <div class="grid dishes" id="dishGrid"></div>
    <p class="fine" style="margin-top:18px">ფასები მიახლოებითია, 2 პორციაზე, თბილისის მაღაზიების მიხედვით.</p>
  </section>

  <footer>ყველაფერი შენთვის, სიყვარულით ♥<br><small>კერძების ფოტოები: <a href="https://commons.wikimedia.org" target="_blank" rel="noopener">Wikimedia Commons</a> (CC BY-SA ლიცენზიით, ავტორების მითითებით იქ)</small></footer>
</div>

<nav class="tabbar" aria-label="განყოფილებები">
  <a href="#today" data-sec="today"><span>♥</span>დღეს</a>
  <a href="#week" data-sec="week"><span>📅</span>კვირა</a>
  <a href="#dishes" data-sec="dishes"><span>🍽</span>კერძები</a>
</nav>

<dialog id="sheet" aria-label="დეტალები"></dialog>

<script>
  /* =========================================================
     Dish catalog. Prices are rough Tbilisi supermarket prices

  function buildDeck() {
    const day = menu[todayIdx];
    const dish = findDish(day.dinner);
    const pick = { name: day.dinner || "სიურპრიზი", photo: dayPhoto(day), dish, mine: true };
    const others = CATALOG
      .filter(d => (d.cat === "ge" || d.cat === "world") && d.name !== pick.name && fits(d))
      .map(d => ({ name: d.name, photo: dishPhoto(d), dish: d }));
    for (let i = others.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [others[i], others[j]] = [others[j], others[i]];
    }
    deck = fits(dish) ? [pick, ...others] : others;
    pos = 0;

        el("p", null, shared.owner && !choice.byOwner
          ? `მან აირჩია: ${choice.name}${dish ? ` (დაახლოებით ${money(dish.cost)})` : ""}. დროა მზადებას შეუდგე!`
          : `დღეს ვახშმად ${choice.name} იქნება${dish ? `, დაახლოებით ${money(dish.cost)}` : ""}. უკვე ვიწყებ მზადებას.`));
      const again = el("button", "btn", "სხვა ავირჩიო"); again.type = "button";
      again.style.marginTop = "20px";
      again.onclick = () => { saveChoice(null); buildDeck(); renderMatch(); };
      textBox.append(again);
      const deckEl = el("div", "deck chosen");
      const card = swipeCard({ name: choice.name, photo: choice.photo, dish }, "დღევანდელი ვახშამი", true);
      card.classList.add("heart-pop");
      deckEl.append(card);
      deckBox.replaceChildren(deckEl);
      return;
    }

    textBox.replaceChildren(eyebrow,
      el("h1", null, "რას მიირთმევ დღეს?"),
      el("p", null, "მე უკვე ავარჩიე. თუ არ გინდა, გადაფურცლე მარცხნივ და სხვას შემოგთავაზებ."));
    if (day.note) textBox.append(el("p", "note", day.note));

    const deckEl = el("div", "deck");
    if (!deck.length) {
      const empty = el("div", "empty-deck");
      empty.append(el("b", null, "ვერაფერი ვიპოვე"), document.createTextNode("ამ ბიუჯეტში კერძი არ ჯდება. ცოტა გაზარდე ბიუჯეტი."));
      deckEl.append(empty);
      deckBox.replaceChildren(deckEl);
      return;
    }
    const label = item => item.mine ? "ჩემი არჩევანი ♥" : `ვარიანტი ${deck.indexOf(item) + 1} / ${deck.length}`;
    const cur = deck[pos], next = deck[(pos + 1) % deck.length];
    if (deck.length > 1) {
      const behind = swipeCard(next, label(next), next.mine);
      behind.classList.add("behind");
      deckEl.append(behind);
    }
    const top = swipeCard(cur, label(cur), cur.mine);
    deckEl.append(top);
    enableDrag(top);

    const choices = el("div", "choices");
    const no = el("button", "round no", "✕"); no.type = "button"; no.setAttribute("aria-label", "სხვა კერძი მაჩვენე");
    const yes = el("button", "round yes", "♥"); yes.type = "button"; yes.setAttribute("aria-label", "ეს მინდა");
    no.onclick = () => decide(false);
    yes.onclick = () => decide(true);
    choices.append(no, yes);
    deckBox.replaceChildren(deckEl, choices);
  }

  let busy = false;
  function decide(yes) {
    const top = document.querySelector(".deck:not(.chosen) .swipe:not(.behind)");
    if (!top || busy) return;
    busy = true;
    const dir = yes ? 1 : -1;
    top.querySelector(yes ? ".stamp.yes" : ".stamp.no").style.opacity = 1;
    top.style.transition = "transform .45s cubic-bezier(.3,.6,.3,1)";
    top.style.transform = `translateX(${dir * 140}%) rotate(${dir * 28}deg)`;
    const behind = document.querySelector(".deck .swipe.behind");
    if (behind) { behind.style.transform = "none"; behind.style.filter = "none"; }
    setTimeout(() => {
      busy = false;
      if (yes) saveChoice({ name: deck[pos].name, photo: deck[pos].photo });
      else pos = (pos + 1) % deck.length;
      renderMatch();
    }, 380);
  }

  function enableDrag(card) {
    let startX = 0, dx = 0, dragging = false;
    const yesStamp = card.querySelector(".stamp.yes"), noStamp = card.querySelector(".stamp.no");
    card.addEventListener("pointerdown", e => {
      dragging = true; startX = e.clientX; dx = 0;
      card.setPointerCapture(e.pointerId);
      card.style.transition = "none";
    });
    card.addEventListener("pointermove", e => {
      if (!dragging) return;
      dx = e.clientX - startX;
      card.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`;
      yesStamp.style.opacity = Math.max(0, Math.min(1, dx / 100));
      noStamp.style.opacity = Math.max(0, Math.min(1, -dx / 100));
    });
    const end = () => {
      if (!dragging) return;
      dragging = false;
      if (Math.abs(dx) > 100) return decide(dx > 0);
      card.style.transition = "transform .3s cubic-bezier(.2,.8,.2,1)";
      card.style.transform = "";
      yesStamp.style.opacity = noStamp.style.opacity = 0;
    };
    card.addEventListener("pointerup", end);
    card.addEventListener("pointercancel", end);
  }

  document.addEventListener("keydown", e => {
    if (sheet.open || e.target.closest("input, textarea, select")) return;
    if (e.key === "ArrowRight") decide(true);
    if (e.key === "ArrowLeft") decide(false);
  });

  /* ---------- week grid ---------- */
  function weekRange() {
    const now = new Date();
    const mon = new Date(now); mon.setDate(now.getDate() - todayIdx);
    const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
    const f = d => `${d.getDate()} ${MONTHS[d.getMonth()]}`;
    return `${f(mon)} — ${f(sun)}`;
  }

  function renderGrid() {
    const total = menu.reduce((s, d) => s + (findDish(d.dinner)?.cost || 0), 0);
    document.getElementById("weekMeta").textContent = `${weekRange()} · ვახშმები ≈ ${money(total)}`;
    document.getElementById("grid").replaceChildren(...menu.map((d, i) => {
      const dish = findDish(d.dinner);
      const card = el("button", "card" + (i === todayIdx ? " is-today" : ""));
      card.type = "button";
      const ph = el("div", "photo");
      ph.append(photoEl(dayPhoto(d), d.dinner), el("span", "day-chip" + (i === todayIdx ? " now" : ""), i === todayIdx ? "დღეს · " + DAYS[i] : DAYS[i]));
      if (dish) ph.append(el("span", "price-chip", "≈ " + money(dish.cost)));
      const body = el("div", "card-body");
      body.append(el("h3", null, d.dinner || "სიურპრიზი"), el("p", null, [d.breakfast, d.lunch].filter(Boolean).join(" · ")));
      card.append(ph, body);
      card.onclick = () => openDay(i);
      return card;
    }));
  }

  /* ---------- dish catalog ---------- */
  let cat = "all";
  function renderCats() {
    const box = document.getElementById("cats");
    box.replaceChildren(...[["all", "ყველა"], ...Object.entries(CATS)].map(([k, label]) => {
      const c = el("button", "chip" + (cat === k ? " on" : ""), label); c.type = "button";
      c.onclick = () => { cat = k; renderCats(); renderDishes(); };
      return c;
    }));
  }
  function renderDishes() {
    const q = document.getElementById("search").value.trim().toLowerCase();
    const sort = document.getElementById("sort").value;
    const budget = loadBudget();
    let list = CATALOG.filter(d => (cat === "all" || d.cat === cat) &&
      (!q || d.name.toLowerCase().includes(q) || d.ings.some(i => i[0].toLowerCase().includes(q))));
    list.sort(sort === "pricey" ? (a, b) => b.cost - a.cost : sort === "fast" ? (a, b) => a.time - b.time : (a, b) => a.cost - b.cost);
    document.getElementById("dishCount").textContent = `${CATALOG.length} კერძი, ფასით და რეცეპტით`;
    const grid = document.getElementById("dishGrid");
    if (!list.length) { grid.replaceChildren(el("p", "none", "ასეთი კერძი ვერ ვიპოვე. სცადე სხვა სიტყვა.")); return; }
    grid.replaceChildren(...list.map(d => {
      const card = el("button", "card"); card.type = "button";
      const ph = el("div", "photo");
      ph.append(photoEl(dishPhoto(d), d.name), el("span", "price-chip" + (fits(d, budget) ? "" : " over"), "≈ " + money(d.cost)));
      const body = el("div", "card-body");
      body.append(el("h3", null, d.name), el("p", null, `${CATS[d.cat]} · ${d.time} წთ`));
      card.append(ph, body);
      card.onclick = () => openRecipe(d);
      return card;
    }));
  }
  document.getElementById("search").addEventListener("input", renderDishes);
  document.getElementById("sort").addEventListener("change", renderDishes);

  /* ---------- dialogs ---------- */
  function sheetTop(label) {
    const top = el("div", "sheet-top");
    top.append(el("span", "eyebrow", label));
    const x = el("button", "close", "✕"); x.type = "button"; x.setAttribute("aria-label", "დახურვა");
    x.onclick = () => sheet.close();
    top.append(x);
    return top;
  }
  function show(node) {
    sheet.replaceChildren(node);
    sheet.scrollTop = 0;
    if (!sheet.open) sheet.showModal();
  }

  function openRecipe(d) {
    const wrap = el("div", "sheet recipe");
    const ph = el("div", "photo"); ph.append(photoEl(dishPhoto(d), d.name));
    const body = el("div", "sheet-body");
    const meta = el("div", "meta");
    meta.append(el("span", "cost" + (fits(d) ? "" : " over"), `≈ ${money(d.cost)}`), el("span", null, `⏱ ${d.time} წთ`), el("span", null, "2 პორცია"), el("span", null, CATS[d.cat]));

    const table = el("table", "ings");
    const tb = el("tbody");
    d.ings.forEach(([name, amount, price]) => {
      const tr = el("tr");
      tr.append(el("td", null, name), el("td", null, amount), el("td", null, price.toFixed(1) + " ₾"));
      tb.append(tr);
    });
    const tf = el("tfoot"); const tr = el("tr");
    const tdl = el("td", null, "სულ"); tdl.colSpan = 2;
    tr.append(tdl, el("td", null, money(d.cost))); tf.append(tr);
    table.append(tb, tf);

    const steps = el("ol", "steps");
    d.steps.forEach(s => steps.append(el("li", null, s)));

    const actions = el("div", "actions");
    const vid = el("a", "btn video", "▶ ვიდეო რეცეპტი");
    vid.href = videoUrl(d); vid.target = "_blank"; vid.rel = "noopener";
    actions.append(vid);
    if (!loadChoice() && fits(d)) {
      const pick = el("button", "btn accent", "♥ დღეს ეს მინდა"); pick.type = "button";
      pick.onclick = () => {
        saveChoice({ name: d.name, photo: dishPhoto(d) });
        sheet.close(); renderMatch();
        document.getElementById("today").scrollIntoView();
      };
      actions.append(pick);
    }

    body.append(sheetTop(CATS[d.cat]), el("h2", null, d.name), meta,
      el("h4", null, "ინგრედიენტები და ფასები"), table,
      el("h4", null, "მომზადება"), steps,
      el("p", "fine", "ფასები მიახლოებითია და მაღაზიის მიხედვით იცვლება."), actions);
    wrap.append(ph, body);
    show(wrap);
  }

  function openDay(i) {
    const d = menu[i];
    const dish = findDish(d.dinner);
    const wrap = el("div", "sheet");
    const ph = el("div", "photo"); ph.append(photoEl(dayPhoto(d), d.dinner));
    const body = el("div", "sheet-body");
    body.append(sheetTop(i === todayIdx ? "დღეს · " + DAYS[i] : DAYS[i]), el("h2", null, d.dinner || "სიურპრიზი"));
    if (dish) {
      const meta = el("div", "meta");
      meta.append(el("span", "cost" + (fits(dish) ? "" : " over"), `≈ ${money(dish.cost)}`), el("span", null, `⏱ ${dish.time} წთ`));
      body.append(meta);
    }
    const meals = el("div", "meals");
    MEALS.forEach(([k, label]) => {
      const row = el("div");
      const val = el("span", null, d[k] || "—");
      row.append(el("small", null, label), val);
      meals.append(row);
    });
    body.append(meals);
    if (d.note) body.append(el("p", "note", d.note));
    const actions = el("div", "actions");
    if (dish) {
      const r = el("button", "btn accent", "რეცეპტი და ფასები"); r.type = "button";
      r.onclick = () => openRecipe(dish);
      actions.append(r);
    }
    const edit = el("button", "btn soft", "მენიუს შეცვლა"); edit.type = "button";
    edit.onclick = () => editDay(i);
    actions.append(edit);
    body.append(actions);
    wrap.append(ph, body);
    show(wrap);
  }

  function editDay(i) {
    const draft = { ...menu[i] };
    const wrap = el("div", "sheet");
    const ph = el("div", "photo");
    const drawPhoto = () => {
      const up = el("div", "upload");
      const lab = el("label", null, draft.photo ? "ფოტოს შეცვლა" : "ჩემი ფოტო");
      const file = el("input"); file.type = "file"; file.accept = "image/*";
      file.onchange = async () => {
        if (!file.files[0]) return;
        draft.photo = await shrink(file.files[0]);
        drawPhoto();
      };
      lab.append(file); up.append(lab);
      if (draft.photo) {
        const rm = el("button", null, "წაშლა"); rm.type = "button";
        rm.onclick = () => { draft.photo = ""; drawPhoto(); };
        up.append(rm);
      }
      ph.replaceChildren(photoEl(dayPhoto(draft), draft.dinner), up);
    };
    drawPhoto();

    const body = el("div", "sheet-body");
    const form = el("form", "edit");
    const listId = "dish-list";
    const field = (key, label, multi) => {
      const l = el("label", null, label);
      const inp = el(multi ? "textarea" : "input");
      if (!multi) { inp.type = "text"; inp.setAttribute("list", listId); } else inp.rows = 2;
      inp.value = draft[key] || "";
      inp.oninput = () => { draft[key] = inp.value; if (key === "dinner") drawPhoto(); };
      l.append(inp); form.append(l);
    };
    const dl = el("datalist"); dl.id = listId;
    CATALOG.forEach(d => { const o = el("option"); o.value = d.name; dl.append(o); });
    form.append(dl);
    field("dinner", "ვახშამი (აირჩიე სიიდან ან ჩაწერე)");
    field("breakfast", "საუზმე");
    field("lunch", "სადილი");
    field("note", "პატარა წერილი", true);

    const err = el("p", "error");
    const actions = el("div", "actions");
    const ok = el("button", "btn accent", "შენახვა"); ok.type = "submit";
    const cancel = el("button", "btn soft", "გაუქმება"); cancel.type = "button";
    cancel.onclick = () => openDay(i);
    actions.append(ok, cancel);
    form.append(err, actions);
    form.onsubmit = async e => {
      e.preventDefault();
      const before = menu[i];
      Object.keys(draft).forEach(k => { if (typeof draft[k] === "string" && k !== "photo") draft[k] = draft[k].trim(); });
      menu[i] = draft;
      ok.disabled = true;
      const saved = await save(i);
      ok.disabled = false;
      if (!saved) {
        menu[i] = before;
        err.textContent = "ვერ შეინახა — ფოტო ძალიან დიდია. სცადე სხვა ფოტო.";
        return;
      }
      buildDeck(); renderMatch(); renderGrid(); openDay(i);
    };

    body.append(sheetTop(DAYS[i]), form);
    wrap.append(ph, body);
    show(wrap);
  }

  // Resize uploads so a week of photos fits in browser storage.
  function shrink(fileObj, max = 800) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(img.src);
        resolve(c.toDataURL("image/jpeg", .8));
      };
      img.onerror = reject;
      img.src = URL.createObjectURL(fileObj);
    });
  }

  sheet.addEventListener("click", e => { if (e.target === sheet) sheet.close(); });

  /* ---------- nav highlight ---------- */
  const navLinks = document.querySelectorAll("[data-sec]");
  const spy = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting) navLinks.forEach(a => a.classList.toggle("on", a.dataset.sec === en.target.id));
    });
  }, { rootMargin: "-45% 0px -50% 0px" });
  ["today", "week", "dishes"].forEach(id => spy.observe(document.getElementById(id)));

  buildDeck(); renderBudget(); renderMatch(); renderGrid(); renderCats(); renderDishes();

  /* ---------- shared sync ---------- */
  (async () => {
    if (!window.claude || !claude.use) return;
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db) return;
    shared.db = db;
    shared.owner = user?.isOwner() ?? false;
    const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
    const refresh = () => { buildDeck(); renderBudget(); renderMatch(); renderGrid(); renderDishes(); };

    db.doc("state/choice").onSnapshot(snap => {
      const c = snap.exists ? snap.data() : null;
      if (same(c, choiceMem)) return;
      choiceMem = c;
      try { c ? localStorage.setItem(CHOICE_KEY, JSON.stringify(c)) : localStorage.removeItem(CHOICE_KEY); } catch (e) {}
      buildDeck(); renderMatch();
    }, () => {});
    db.doc("state/budget").onSnapshot(snap => {
      const b = snap.exists ? Number(snap.data().value) || 0 : loadBudget();
      if (b === budgetMem && b === loadBudget()) return;
      budgetMem = b;
      try { localStorage.setItem(BUDGET_KEY, String(b)); } catch (e) {}
      refresh();
    }, () => {});
    db.collection("menu").onSnapshot(qs => {
      let changed = false;
      qs.docs.forEach(d => {
        const i = Number(d.id.slice(1));
        if (i >= 0 && i < 7 && !same(d.data(), menu[i])) { menu[i] = { ...SAMPLE[i], ...d.data() }; changed = true; }
      });
      if (changed) refresh();
    }, () => {});
  })();
</script>
</body>
</html>
